<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldView Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2328; }
    header { background: #1f2328; color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; }
    header span { font-size: 12px; color: #aaa; }
    .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #3b82d4; }
    .stat-label { font-size: 12px; color: #57606a; margin-top: 4px; }
    .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .section-header h2 { font-size: 15px; font-weight: 600; }
    .search-input {
      padding: 5px 10px; font-size: 13px; border: 1px solid #e5e7eb;
      border-radius: 6px; outline: none; width: 220px;
    }
    .search-input:focus { border-color: #3b82d4; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: #f7f8fa; text-align: left; padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb; font-weight: 600; color: #57606a;
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    th:hover { background: #eef0f3; color: #1f2328; }
    th .sort-icon { margin-left: 4px; font-size: 10px; color: #94a3b8; }
    th.sort-asc .sort-icon::after  { content: ' ▲'; color: #3b82d4; }
    th.sort-desc .sort-icon::after { content: ' ▼'; color: #3b82d4; }
    th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: ' ⇅'; }
    td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f7f8fa; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
    .badge-yes   { background: #dcfce7; color: #166534; }
    .badge-no    { background: #f1f5f9; color: #94a3b8; }
    .badge-email { background: #dbeafe; color: #1d4ed8; }
    .badge-fuzzy { background: #fef9c3; color: #854d0e; }
    .loading { color: #57606a; font-size: 14px; padding: 20px 0; }
    .overflow { overflow-x: auto; }
    .no-results { text-align: center; color: #57606a; padding: 20px; font-size: 13px; }
    .row-count { font-size: 12px; color: #57606a; }
  </style>
</head>
<body>
  <header>
    <h1>GoldView</h1>
    <span>Golden Customer Record Dashboard</span>
  </header>

  <div class="container">
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-value">—</div><div class="stat-label">Raw Records</div></div>
      <div class="stat"><div class="stat-value">—</div><div class="stat-label">Golden Records</div></div>
      <div class="stat"><div class="stat-value">—</div><div class="stat-label">Duplicates Merged</div></div>
      <div class="stat"><div class="stat-value">3</div><div class="stat-label">Source Systems</div></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Golden Customer Records <span class="row-count" id="golden-count"></span></h2>
        <input class="search-input" id="golden-search" type="text" placeholder="Search name, email, city..." />
      </div>
      <div class="overflow"><table id="golden-table"><tr><td class="loading">Loading...</td></tr></table></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Duplicate Merge Log <span class="row-count" id="dupe-count"></span></h2>
        <input class="search-input" id="dupe-search" type="text" placeholder="Search source, ID..." />
      </div>
      <div class="overflow"><table id="dupe-table"><tr><td class="loading">Loading...</td></tr></table></div>
    </div>
  </div>

  <script type="module">
    const API = 'http://localhost:3000/api/golden';

    // ── Sortable + filterable table helper ─────────────────────────────
    function makeTable({ tableId, searchId, countId, columns, rows, renderRow }) {
      let sortKey = null;
      let sortDir = 'asc';
      let filter  = '';

      const tableEl  = document.getElementById(tableId);
      const searchEl = document.getElementById(searchId);
      const countEl  = document.getElementById(countId);

      function filtered() {
        if (!filter) return rows;
        const q = filter.toLowerCase();
        return rows.filter(r =>
          columns.some(c => String(r[c.key] ?? '').toLowerCase().includes(q))
        );
      }

      function sorted(data) {
        if (!sortKey) return data;
        return [...data].sort((a, b) => {
          const va = String(a[sortKey] ?? '');
          const vb = String(b[sortKey] ?? '');
          const num_a = parseFloat(va), num_b = parseFloat(vb);
          const cmp = (!isNaN(num_a) && !isNaN(num_b))
            ? num_a - num_b
            : va.localeCompare(vb);
          return sortDir === 'asc' ? cmp : -cmp;
        });
      }

      function render() {
        const data = sorted(filtered());
        countEl.textContent = `(${data.length} of ${rows.length})`;

        const thead = `<thead><tr>${columns.map(c => {
          const cls = sortKey === c.key ? `sort-${sortDir}` : '';
          return `<th class="${cls}" data-key="${c.key}">${c.label}<span class="sort-icon"></span></th>`;
        }).join('')}</tr></thead>`;

        const tbody = data.length
          ? `<tbody>${data.map(r => `<tr>${renderRow(r)}</tr>`).join('')}</tbody>`
          : `<tbody><tr><td colspan="${columns.length}" class="no-results">No results found.</td></tr></tbody>`;

        tableEl.innerHTML = thead + tbody;

        // attach sort listeners
        tableEl.querySelectorAll('th[data-key]').forEach(th => {
          th.addEventListener('click', () => {
            const key = th.dataset.key;
            if (sortKey === key) {
              sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
              sortKey = key;
              sortDir = 'asc';
            }
            render();
          });
        });
      }

      searchEl.addEventListener('input', e => { filter = e.target.value; render(); });
      render();
    }

    // ── Load data ───────────────────────────────────────────────────────
    async function load() {
      const res  = await fetch(API);
      const data = await res.json();
      const { summary, golden_customers, duplicate_log } = data;

      // Stats
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-value">${summary.total_raw_records}</div><div class="stat-label">Raw Records</div></div>
        <div class="stat"><div class="stat-value">${summary.golden_records}</div><div class="stat-label">Golden Records</div></div>
        <div class="stat"><div class="stat-value">${summary.duplicates_merged}</div><div class="stat-label">Duplicates Merged</div></div>
        <div class="stat"><div class="stat-value">3</div><div class="stat-label">Source Systems</div></div>
      `;

      // Golden table
      makeTable({
        tableId:  'golden-table',
        searchId: 'golden-search',
        countId:  'golden-count',
        columns: [
          { key: 'golden_id',        label: 'Golden ID' },
          { key: 'full_name',        label: 'Name' },
          { key: 'dob',              label: 'DOB' },
          { key: 'email',            label: 'Email' },
          { key: 'city',             label: 'City' },
          { key: 'has_core_banking', label: 'Core Banking' },
          { key: 'has_credit_card',  label: 'Credit Card' },
          { key: 'has_mortgage',     label: 'Mortgage' },
          { key: 'match_method',     label: 'Match Method' },
          { key: 'confidence_score', label: 'Confidence' },
        ],
        rows: golden_customers.map(r => ({ ...r, full_name: `${r.first_name} ${r.last_name}` })),
        renderRow: r => `
          <td>${r.golden_id}</td>
          <td>${r.full_name}</td>
          <td>${r.dob}</td>
          <td>${r.email}</td>
          <td>${r.city}, ${r.state}</td>
          <td><span class="badge ${r.has_core_banking === 'True' ? 'badge-yes' : 'badge-no'}">${r.has_core_banking === 'True' ? 'Yes' : 'No'}</span></td>
          <td><span class="badge ${r.has_credit_card  === 'True' ? 'badge-yes' : 'badge-no'}">${r.has_credit_card  === 'True' ? 'Yes' : 'No'}</span></td>
          <td><span class="badge ${r.has_mortgage     === 'True' ? 'badge-yes' : 'badge-no'}">${r.has_mortgage     === 'True' ? 'Yes' : 'No'}</span></td>
          <td><span class="badge ${r.match_method === 'email_match' ? 'badge-email' : 'badge-fuzzy'}">${r.match_method}</span></td>
          <td>${parseFloat(r.confidence_score).toFixed(2)}</td>
        `,
      });

      // Dupe table
      makeTable({
        tableId:  'dupe-table',
        searchId: 'dupe-search',
        countId:  'dupe-count',
        columns: [
          { key: 'incoming_source',    label: 'Source' },
          { key: 'incoming_source_id', label: 'Source ID' },
          { key: 'matched_golden_id',  label: 'Matched Golden ID' },
          { key: 'match_method',       label: 'Match Method' },
          { key: 'confidence_score',   label: 'Confidence' },
        ],
        rows: duplicate_log,
        renderRow: r => `
          <td>${r.incoming_source}</td>
          <td>${r.incoming_source_id}</td>
          <td>${r.matched_golden_id}</td>
          <td><span class="badge ${r.match_method === 'email_match' ? 'badge-email' : 'badge-fuzzy'}">${r.match_method}</span></td>
          <td>${parseFloat(r.confidence_score).toFixed(2)}</td>
        `,
      });
    }

    load().catch(err => {
      document.getElementById('golden-table').innerHTML =
        `<tr><td style="color:red">Error: ${err.message}. Make sure the backend is running on port 3000.</td></tr>`;
    });
  </script>
</body>
</html>
